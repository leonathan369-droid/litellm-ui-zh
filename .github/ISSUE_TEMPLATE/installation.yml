name: Installation problem
description: Report a reproducible installation, verification, or restore issue.
title: "install: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Do not post API keys, master keys, passwords, database URLs, cookies,
        access tokens, full configuration files, request content, or unredacted logs.
        Replace private paths, hosts, and identifiers before submitting.
  - type: input
    id: operating-system
    attributes:
      label: Operating system and version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: litellm-version
    attributes:
      label: LiteLLM version
      placeholder: 1.99.0
    validations:
      required: true
  - type: textarea
    id: install-command
    attributes:
      label: Sanitized command used
      description: Remove private usernames, paths, and all credentials.
      placeholder: python3 scripts/install.py install --target /path/to/ui-zh
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error
      description: Include only sanitized terminal output.
    validations:
      required: true
  - type: textarea
    id: check-output
    attributes:
      label: Sanitized check output
      description: Run the check command from SUPPORT.md and remove private data.
    validations:
      required: true
