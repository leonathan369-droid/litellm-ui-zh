name: Missing or incorrect translation
description: Report a LiteLLM WebUI string that needs a Simplified Chinese translation fix.
title: "translation: "
labels:
  - translation
body:
  - type: markdown
    attributes:
      value: |
        Do not post API keys, master keys, passwords, database URLs, cookies,
        access tokens, full configuration files, request content, or unredacted logs.
        Redact screenshots and diagnostics before submitting.
  - type: textarea
    id: source-text
    attributes:
      label: Source English text
      description: Copy only the visible English UI text that needs changing.
    validations:
      required: true
  - type: textarea
    id: expected-translation
    attributes:
      label: Expected Simplified Chinese translation
      description: Give the proposed wording and brief context if necessary.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Affected LiteLLM WebUI route
      placeholder: /ui/models-and-endpoints
    validations:
      required: true
  - type: input
    id: litellm-version
    attributes:
      label: LiteLLM version
      placeholder: 1.99.0
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Redacted screenshot (optional)
      description: Remove keys, private URLs, user data, requests, usage data, and logs first.
    validations:
      required: false
