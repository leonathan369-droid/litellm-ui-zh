name: Admin UI Route Review

run-name: Admin UI Route Review ${{ inputs.litellm_version || 'latest reviewed' }} / ${{ inputs.automation_id || github.run_id }}

on:
  push:
    paths:
      - '.github/workflows/admin-ui-route-review.yml'
      - 'scripts/**'
      - 'src/**'
      - 'locales/**'
      - 'dist/**'
      - 'compatibility/**'
      - 'tests/admin_ui_route_review.py'
  workflow_dispatch:
    inputs:
      litellm_version:
        description: Exact stable LiteLLM version to verify
        required: false
        default: ''
        type: string
      automation_id:
        description: Correlation ID for an automated compatibility update
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    name: LiteLLM ${{ inputs.litellm_version || 'latest reviewed' }} authenticated routes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: litellm
          POSTGRES_DB: litellm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U litellm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://litellm@127.0.0.1:5432/litellm
      UI_USERNAME: admin
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      DISABLE_SCHEMA_UPDATE: "true"
      LITELLM_VERSION: ${{ inputs.litellm_version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Select the exact LiteLLM version
        run: |
          set -euo pipefail
          if [ -z "${LITELLM_VERSION:-}" ]; then
            LITELLM_VERSION="$(python3 -c 'import json; print(json.load(open("compatibility/upstream.json", encoding="utf-8"))["latest_automated_verified"])')"
          fi
          python3 - "$LITELLM_VERSION" <<'PY'
          import re
          import sys
          assert re.fullmatch(r"\d+(?:\.\d+)+", sys.argv[1]), sys.argv[1]
          PY
          echo "LITELLM_VERSION=$LITELLM_VERSION" >> "$GITHUB_ENV"

      - name: Generate ephemeral UI credentials
        shell: bash
        run: |
          set -euo pipefail
          value="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$value"
          echo "UI_PASSWORD=$value" >> "$GITHUB_ENV"
          echo "LITELLM_MASTER_KEY=$value" >> "$GITHUB_ENV"

      - name: Install exact LiteLLM and Playwright
        run: |
          python3 -m pip install --disable-pip-version-check "litellm[proxy]==$LITELLM_VERSION" "prisma==0.11.0" "playwright==1.55.0"
          python3 -m playwright install --with-deps chromium

      - name: Initialize temporary LiteLLM database
        shell: bash
        run: |
          set -euo pipefail
          schema="$(python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.find_spec("litellm")
          assert spec and spec.origin
          schema = Path(spec.origin).resolve().parent / "proxy" / "schema.prisma"
          assert schema.is_file(), schema
          print(schema)
          PY
          )"
          echo "Using Prisma schema: $schema"
          python3 -m prisma generate --schema "$schema"
          python3 -m prisma db push --schema "$schema" --accept-data-loss

      - name: Install overlay
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/litellm-ui-zh-auth"
          python3 scripts/install.py install --target "$target"
          echo "LITELLM_UI_PATH=$target" >> "$GITHUB_ENV"

      - name: Start LiteLLM and review authenticated routes
        shell: bash
        run: |
          set -euo pipefail
          litellm --host 127.0.0.1 --port 4000 > "$RUNNER_TEMP/litellm-auth.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:4000/health/liveliness" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 200 "$RUNNER_TEMP/litellm-auth.log"
            exit 1
          fi

          python3 tests/admin_ui_route_review.py

      - name: Upload route review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: litellm-${{ inputs.litellm_version || 'latest-reviewed' }}-authenticated-admin-routes
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/admin-routes
            ${{ runner.temp }}/litellm-auth.log
